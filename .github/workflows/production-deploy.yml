name: Production Deployment & Migration

on:
  push:
    branches:
      - main

concurrency:
  group: "production-deploy"
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  production-migration:
    name: Run Production DB Migration
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Execute Production Migration
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: |
          npx prisma generate
          npx prisma migrate deploy

  trigger-vercel:
    name: Trigger Vercel Deployment
    runs-on: ubuntu-latest
    needs: production-migration
    timeout-minutes: 5
    steps:
      - name: Deploy to Vercel via Webhook
        run: |
          curl -f -X POST ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
